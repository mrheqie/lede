name: Scan Firmware Features

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Prepare Source
        run: |
          git config --global credential.helper ""
          git clone -b master https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          mkdir -p package/passwall
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall package/passwall
          # 依然需要 update feeds，但不再需要 install 全量依赖，这步快且稳
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Scan Package List
        run: |
          cd openwrt
          # 【核心修改】不跑 make manifest，直接扫描目录
          echo "=== 固件中集成的 LuCI 应用 (插件) ===" > ../feature-list.txt
          # 查找 package 和 feeds 目录下所有的 luci-app 文件夹
          find package feeds -maxdepth 3 -name "luci-app-*" -type d >> ../feature-list.txt
          
          echo -e "\n=== 固件中集成的核心组件 (Xray/Sing-box等) ===" >> ../feature-list.txt
          find package feeds -maxdepth 3 -name "*-core" -type d >> ../feature-list.txt
          
          echo -e "\n=== 检查当前默认生成的配置文件 (.config) ===" >> ../feature-list.txt
          # 这一步生成 defconfig，让我们看看系统默认想编译什么
          make defconfig
          cat .config | grep "CONFIG_PACKAGE_" | grep "=y" >> ../feature-list.txt

      - name: Upload Manifest
        uses: actions/upload-artifact@v4
        with:
          name: feature-list
          path: feature-list.txt

name: Scan Firmware Features

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Prepare Source
        run: |
          git clone -b master https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          
          # 【方案优化】放弃 feeds.conf.default，直接 clone 到 package 目录
          # 这能绕过 feeds 索引失败的问题，OpenWrt 编译时会自动识别
          mkdir -p package/passwall
          git clone https://github.com/xiaorouji/openwrt-passwall package/passwall
          
          # 更新并安装 feed 依赖 (仅用于其他必要的基础包，如 luci)
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure and Generate Manifest
        run: |
          cd openwrt
          # 必须先配置目标设备，否则无法生成对应设备的 manifest
          # 为 JCG Q30 PRO (MT7981) 配置
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_q30-pro=y" >> .config
          
          # 更新配置
          make defconfig
          
          # 生成 manifest
          make manifest
          
          # 确认文件路径是否正确（有时路径中会有微小差异）
          # 使用 find 命令来寻找生成的 .manifest 文件，防止路径写死导致的错误
          find bin/targets/ -name "*.manifest" -exec cp {} ../feature-list.txt \;

      - name: Upload Manifest
        uses: actions/upload-artifact@v4
        with:
          name: feature-list
          path: feature-list.txt

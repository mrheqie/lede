name: Build Kunpeng CC (MT7628 + EC200A) Dedicated Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 1. 尽可能多地压榨并清理磁盘空间
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /var/lib/apt/lists/*
        sudo rm -rf /usr/local/share/boost /opt/az /usr/share/game /usr/local/lib/node_modules
        
        # 2. 更新源并强制使用无推荐依赖模式安装编译工具链
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake xxd cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xmlto xz-utils zlib1g-dev
        
        # 3. 清理收尾
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH lede
        ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

    - name: Update & Install feeds
      run: |
        cd lede
        # 纯净运行大雕自带源的更新与安装，不再引入任何外部冲突仓库
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Custom Configuration (.config)
      run: |
        cd lede
        
        # 1. 强行锁定核心架构与机型定义（自动触发底层的 4G 模组驱动）
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
        echo "CONFIG_TARGET_ramips_mt76x8_DEVICE_nradio_wt6285=y" >> .config
        
        # 2. 注入基础网页、简中语言包与核心防火墙
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        # 3. 明确启用 SSR-Plus，并进行极限内核瘦身（只留核心，拒绝巨无霸）
        echo "CONFIG_PACKAGE_luci-app-ssr-plus=y" >> .config
        # 强行关闭 SSR-Plus 内部自带的 Xray/V2ray 等大体积 Golang 内核，只留轻量化的本地 SS/SSR
        echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_V2ray=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Socks5_Proxy=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Moira=n" >> .config
        
        # 4. 【精准歼灭大雕默认全家桶】强行关闭所有默认勾选、但占地方的臃肿插件
        # 这一步将为 15.4MB 的小空间腾出巨大的空白包厢
        echo "CONFIG_PACKAGE_luci-app-vsftpd=n" >> .config       # 砍掉 FTP 服务器
        echo "CONFIG_PACKAGE_luci-app-vlmcsd=n" >> .config       # 砍掉 KMS 微软激活
        echo "CONFIG_PACKAGE_luci-app-nlbwmon=n" >> .config      # 砍掉流量监控
        echo "CONFIG_PACKAGE_luci-app-ddns=n" >> .config         # 砍掉动态域名
        echo "CONFIG_PACKAGE_luci-app-arpbind=n" >> .config      # 砍掉 ARP 绑定
        echo "CONFIG_PACKAGE_luci-app-filetransfer=n" >> .config  # 砍掉文件传输
        echo "CONFIG_PACKAGE_luci-app-wol=n" >> .config           # 砍掉网络唤醒
        echo "CONFIG_PACKAGE_luci-app-accesscontrol=n" >> .config # 砍掉访问控制
        echo "CONFIG_PACKAGE_luci-app-upnp=n" >> .config          # 砍掉 UPnP 自动端口映射
        echo "CONFIG_PACKAGE_luci-app-rclone_INCLUDE_rclone-ng=n" >> .config # 砍掉网盘挂载依赖
        
        # 5. 极限网络与无线精简（关闭不需要的臃肿组件与 IPv6）
        echo "CONFIG_PACKAGE_wpad-basic-wolfssl=n" >> .config
        echo "CONFIG_PACKAGE_wpad-mini=y" >> .config
        echo "CONFIG_PACKAGE_ppp=n" >> .config
        echo "CONFIG_PACKAGE_ppp-mod-pppoe=n" >> .config
        echo "CONFIG_IPV6=n" >> .config
        echo "CONFIG_PACKAGE_ip6tables=n" >> .config
        
        # 6. 让系统根据以上毁灭性的精简定义，自动补全其余核心依赖
        make defconfig

    - name: Download package
      id: package
      run: |
        cd lede
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd lede
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt_KunpengCC_EC200A_Firmware
        path: lede/bin/targets/ramips/mt76x8/*.bin

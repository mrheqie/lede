name: Build Kunpeng CC (MT7628 + EC200A) Dedicated Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # 1. 尽可能多地压榨并清理磁盘空间
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /var/lib/apt/lists/*
        sudo rm -rf /usr/local/share/boost /opt/az /usr/share/game /usr/local/lib/node_modules
        
        # 2. 更新源并强制使用无推荐依赖模式安装
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake xxd cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xmlto xz-utils zlib1g-dev
        
        # 3. 清理收尾
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH lede
        ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

    - name: Update & Install feeds
      run: |
        cd lede
        # 1. 忘掉 feeds.conf.default！让大雕的官方源干干净净地跑完更新和安装
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 2. 【核心时序修复】必须在 install -a 之后，删掉 feeds 目录里冲突的旧版包
        rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,v2ray-plugin,xray-plugin,geoview,shadow-tls}
        
        # 3. 将 PassWall 官方最新版及所有核心依赖库，直接克隆到本地 package 目录
        # 本地包的优先级处于食物链顶端，编译器会自动扫描并碾压一切，100% 不会再报缺失！
        git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
        git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/openwrt-passwall

    - name: Generate Custom Configuration (.config)
      run: |
        cd lede
        
        # 1. 强行锁定核心架构与机型定义
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
        echo "CONFIG_TARGET_ramips_mt76x8_DEVICE_nradio_wt6285=y" >> .config
        
        # 2. 注入基础网页、简中语言包
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        # 3. 极限网络瘦身（砍掉无用协议、漫游组件与 IPv6 以节省 flash 空间）
        echo "CONFIG_PACKAGE_wpad-basic-wolfssl=n" >> .config
        echo "CONFIG_PACKAGE_wpad-mini=y" >> .config
        echo "CONFIG_PACKAGE_ppp=n" >> .config
        echo "CONFIG_PACKAGE_ppp-mod-pppoe=n" >> .config
        echo "CONFIG_IPV6=n" >> .config
        echo "CONFIG_PACKAGE_ip6tables=n" >> .config
        
        # 4. 【精准歼灭大雕默认全家桶】强行关闭所有默认勾选的臃肿插件
        # 这些全不选，能瞬间省下大约 5MB - 7MB 的黄金空间！
        echo "CONFIG_PACKAGE_luci-app-ssr-plus=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-nlbwmon=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-vsftpd=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-vlmcsd=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-ddns=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-arpbind=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-autoreboot=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-filetransfer=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-upnp=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-wol=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-accesscontrol=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-rclone_INCLUDE_rclone-ng=n" >> .config
        
        # 5. 【核心集成】只保留 PassWall 和最核心的 xray-core
        echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
        echo "CONFIG_PACKAGE_xray-core=y" >> .config
        
        # 【极其关键】关闭 PassWall 默认捆绑的、不需要的次要代理解析内核（比如 shadowsocks-rust 等）
        # 你的侦查日志显示它们会报警告，关闭它们既能省空间，又能消除编译警告
        echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=n" >> .config
        echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=n" >> .config
        
        # 6. 让系统根据以上毁灭性的精简定义，自动补全其余核心依赖
        make defconfig

    - name: Download package
      id: package
      run: |
        cd lede
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd lede
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt_KunpengCC_EC200A_Firmware
        path: lede/bin/targets/ramips/mt76x8/*.bin

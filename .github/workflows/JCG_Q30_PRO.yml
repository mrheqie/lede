name: Build JCG Q30 PRO Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hardcore Free Disk Space & Setup Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /home/runneradmin/.dotnet
          sudo apt-get -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* openjdk* dotnet* powershell mono-devel mysql*
          sudo rm -rf /var/lib/docker /etc/docker
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "==== 剩余可用空间 ===="
          df -h

      - name: Prepare Source
        run: |
          git config --global credential.helper ""
          git clone -b master https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
          echo "src-git easytier https://github.com/EasyTier/luci-app-easytier.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify Feeds Installation
        run: |
          echo "=== 开始验证 Passwall ==="
          if [ -n "$(find openwrt/ -name "luci-app-passwall" -type d)" ]; then
            echo "✅ Passwall LuCI 已找到"
          else
            echo "❌ 严重错误：未找到 Passwall 模块！"
            exit 1
          fi
          echo "=== 开始验证 EasyTier ==="
          if [ -n "$(find openwrt/ -name "luci-app-easytier" -type d)" ]; then
            echo "✅ EasyTier 已找到"
          else
            echo "❌ 严重错误：未找到 EasyTier 模块！"
            exit 1
          fi

      - name: Cache Downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: imm-jcg-q30-ubootmod-dl-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            imm-jcg-q30-ubootmod-dl-

      - name: Configure Firmware & Verify
        run: |
          cd openwrt
          rm -rf .config tmp
          
          # 1. 基础架构注入
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          # 开启多设备支持，防止单一设备被单选机制剔除
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          
          # 2. 运行 defconfig 生成初始环境
          make defconfig
          
          # 3. 使用官方工具注入设备名（这一步会自动处理依赖）
          # 注意：变量名必须完全匹配日志中的 TARGET_DEVICE_...
          echo "=== 正在注入设备: jcg_q30-pro ==="
          ./scripts/config --enable CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro
          
          # 4. 再次 defconfig 固化依赖
          make defconfig
          
          # 5. 注入插件（使用 config 工具安全添加，避免 sed 破坏格式）
          ./scripts/config --enable CONFIG_PACKAGE_luci
          ./scripts/config --enable CONFIG_LUCI_LANG_zh_Hans
          ./scripts/config --enable CONFIG_PACKAGE_luci-theme-bootstrap
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-passwall
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox
          ./scripts/config --enable CONFIG_PACKAGE_luci-app-easytier
          ./scripts/config --enable CONFIG_PACKAGE_kmod-tun
          ./scripts/config --enable CONFIG_PACKAGE_kmod-nft-fullcone
          
          # 6. 最终校验
          echo "=== 最终校验 ==="
          if ! grep -q "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro=y" .config; then
            echo "❌ 关键错误：设备变量 CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro 未被启用！"
            # 打印当前 .config 中的目标设备行，方便排查
            grep "CONFIG_TARGET_DEVICE_.*=y" .config
            exit 1
          fi
          
          echo "✅ 配置注入完成，未破坏格式，准备起飞！"

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Post-Build Verify & Prepare Upload
        run: |
          cd openwrt/bin/targets/mediatek/*
          echo "=== 当前目录所有文件 ==="
          ls -lah
          
          # 优先匹配大分区专用的新版 sysupgrade.itb 固件
          FIRMWARE=$(ls -1 *jcg_q30*sysupgrade.itb *jcg_q30*sysupgrade.bin 2>/dev/null | head -n1)
          if [ -z "$FIRMWARE" ]; then
            echo "❌ 致命错误: 未找到 JCG Q30 编译输出文件!"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$FIRMWARE")
          echo "✅ 成功捕获正式固件: $FIRMWARE (大小: $((SIZE/1024/1024)) MB)"
          sha256sum *jcg_q30*.* > sha256sums.txt

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jcg-q30-pro-fixed-parts
          path: |
            openwrt/bin/targets/mediatek/*/*jcg_q30*
            openwrt/bin/targets/mediatek/*/sha256sums.txt
          retention-days: 7

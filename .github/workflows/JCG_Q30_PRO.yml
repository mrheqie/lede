name: Build JCG Q30 PRO Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hardcore Free Disk Space & Setup Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /home/runneradmin/.dotnet
          sudo apt-get -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* openjdk* dotnet* powershell mono-devel mysql*
          sudo rm -rf /var/lib/docker /etc/docker
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          echo "==== 剩余可用空间 ===="
          df -h

      - name: Prepare Source
        run: |
          git config --global credential.helper ""
          git clone -b master https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
          echo "src-git easytier https://github.com/EasyTier/luci-app-easytier.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify Feeds Installation
        run: |
          echo "=== 开始验证 Passwall ==="
          if [ -n "$(find openwrt/ -name "luci-app-passwall" -type d)" ]; then
            echo "✅ Passwall LuCI 已找到"
          else
            echo "❌ 严重错误：未找到 Passwall 模块！"
            exit 1
          fi
          echo "=== 开始验证 EasyTier ==="
          if [ -n "$(find openwrt/ -name "luci-app-easytier" -type d)" ]; then
            echo "✅ EasyTier 已找到"
          else
            echo "❌ 严重错误：未找到 EasyTier 模块！"
            exit 1
          fi

      - name: Cache Downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: imm-jcg-q30-ubootmod-dl-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            imm-jcg-q30-ubootmod-dl-

      - name: Configure Firmware & Verify
        run: |
          cd openwrt
          
          # 1. 彻底摧毁旧配置和临时缓存，确保环境绝对干净
          rm -rf .config tmp
          
          echo "=== ✍️ 开始硬编码注入极简配置 ==="
          
          # 2. 直接使用 kconfig 标准语法写入最终配置
          cat > .config <<EOF
          # 基础架构锁定
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          
          # 🎯 吸收建议 1：精准锁定 ubootmod（大分区）变体！防止变砖！
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro-ubootmod=y
          
          # 必须开启多设备混合编译引擎，但我们在后面会把多余的切掉
          CONFIG_TARGET_MULTI_PROFILE=y
          
          # LuCI 网页后台基础全家桶
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          
          # 核心插件集成
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y
          # 🎯 吸收建议 2：删除了不存在的 geoview，依赖交给 passwall 自动处理
          
          CONFIG_PACKAGE_luci-app-easytier=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          
          # 强制拉黑所有不需要的大型垃圾插件
          # CONFIG_PACKAGE_luci-app-aria2 is not set
          # CONFIG_PACKAGE_aria2 is not set
          # CONFIG_PACKAGE_luci-app-transmission is not set
          # CONFIG_PACKAGE_transmission-daemon is not set
          # CONFIG_PACKAGE_transmission-web is not set
          # CONFIG_PACKAGE_luci-app-qbittorrent is not set
          # CONFIG_PACKAGE_qbittorrent is not set
          # CONFIG_PACKAGE_luci-app-samba4 is not set
          # CONFIG_PACKAGE_samba4-server is not set
          # CONFIG_PACKAGE_samba4-libs is not set
          # CONFIG_PACKAGE_luci-app-minidlna is not set
          # CONFIG_PACKAGE_minidlna is not set
          # CONFIG_PACKAGE_luci-app-filemanager is not set
          # CONFIG_PACKAGE_dufs is not set
          # CONFIG_PACKAGE_luci-app-dae is not set
          # CONFIG_PACKAGE_dae is not set
          # CONFIG_PACKAGE_luci-app-openclash is not set
          # CONFIG_PACKAGE_luci-app-softether is not set
          # CONFIG_PACKAGE_luci-app-tailscale is not set
          # CONFIG_PACKAGE_tailscale is not set
          EOF
          
          # 3. 展开配置
          make defconfig
          
          echo "=== 🧹 屏蔽同架构无关路由器 ==="
          # 为了只编译 Q30 Pro，把自动带出来的同芯片其他几十个路由器拉黑
          grep "CONFIG_TARGET_DEVICE_.*=y" .config | grep -v "jcg_q30-pro-ubootmod" | cut -d '=' -f 1 | while read -r dev; do
            sed -i "s/${dev}=y/# ${dev} is not set/g" .config
          done
          
          # 4. 终极固化
          make defconfig
          
          echo "=== 🛡️ 编译前终极校验 ==="
          # 校验是否成功锁定 ubootmod 大分区变体
          if ! grep -q "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-pro-ubootmod=y" .config; then
             echo "❌ 致命错误：大分区设备变量被清除！大概率是源码中没有这个 -ubootmod 后缀！"
             echo "当前可用的 q30 相关设备有："
             grep -i "q30" tmp/.config-target.in || true
             exit 1
          fi
          
          if ! grep -q "CONFIG_PACKAGE_luci=y" .config; then
             echo "❌ 致命错误：LuCI 核心未被激活！"
             exit 1
          fi
          
          echo "✅ 完美校验通过！大分区匹配，依赖精简完毕！🚀"

      - name: Download package sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Post-Build Verify & Prepare Upload
        run: |
          cd openwrt/bin/targets/mediatek/*
          echo "=== 当前目录所有文件 ==="
          ls -lah
          
          # 优先匹配大分区专用的新版 sysupgrade.itb 固件
          FIRMWARE=$(ls -1 *jcg_q30*sysupgrade.itb *jcg_q30*sysupgrade.bin 2>/dev/null | head -n1)
          if [ -z "$FIRMWARE" ]; then
            echo "❌ 致命错误: 未找到 JCG Q30 编译输出文件!"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$FIRMWARE")
          echo "✅ 成功捕获正式固件: $FIRMWARE (大小: $((SIZE/1024/1024)) MB)"
          sha256sum *jcg_q30*.* > sha256sums.txt

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jcg-q30-pro-fixed-parts
          path: |
            openwrt/bin/targets/mediatek/*/*jcg_q30*
            openwrt/bin/targets/mediatek/*/sha256sums.txt
          retention-days: 7

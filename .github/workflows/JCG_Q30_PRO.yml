name: Build JCG Q30 PRO Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

      - name: Prepare Source
        run: |
          git config --global credential.helper ""
          git clone -b master https://github.com/immortalwrt/immortalwrt openwrt
          cd openwrt
          
          # 1. 仅添加一次 Passwall 源，因为它包含所有内容
          echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
          
          # 2. 添加 EasyTier
          echo "src-git easytier https://github.com/EasyTier/luci-app-easytier.git" >> feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify Feeds Installation
        run: |
          echo "=== 开始验证 Passwall ==="
          if [ -n "$(find openwrt/ -name "luci-app-passwall" -type d)" ]; then
            echo "✅ Passwall LuCI 已找到"
          else
            echo "❌ 严重错误：未找到 Passwall 模块！"
            find openwrt/ -name "luci-app-passwall"
            exit 1
          fi
          
          echo "=== 开始验证 EasyTier ==="
          if [ -n "$(find openwrt/ -name "luci-app-easytier" -type d)" ]; then
            echo "✅ EasyTier 已找到"
          else
            echo "❌ 严重错误：未找到 EasyTier 模块！"
            exit 1
          fi

      - name: Cache Downloads & Build
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/build_dir
          # 修改为 v3，确保不与之前原厂小分区的编译缓存混淆，强制生成干净的大分区环境
          key: imm-jcg-q30-ubootmod-build-v3-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            imm-jcg-q30-ubootmod-build-v4-

      - name: Configure Firmware
        run: |
          cd openwrt
          
          # 目标配置 (关键点：已修改为大分区 ubootmod 专属机型)
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_jcg_q30-ubootmod=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_q30-ubootmod=y" >> .config
          
          # 核心功能与补丁
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y" >> .config
          echo "CONFIG_PACKAGE_geoview=y" >> .config 
          echo "CONFIG_PACKAGE_luci-app-easytier=y" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nft-fullcone=y" >> .config
          
          make defconfig
          
          # 深度精简 (前后端包一网打尽)
          PLUGINS_TO_REMOVE=(
            "luci-app-aria2" "aria2" "luci-app-transmission" "transmission-daemon" "transmission-web"
            "luci-app-qbittorrent" "qbittorrent" "luci-app-samba4" "samba4-server" "samba4-libs"
            "luci-app-minidlna" "minidlna" "luci-app-filemanager" "dufs"
            "luci-app-dae" "dae" "luci-app-openclash" "luci-app-softether" 
            "luci-app-tailscale" "tailscale"
          )
          
          for pkg in "${PLUGINS_TO_REMOVE[@]}"; do
            sed -i "/CONFIG_PACKAGE_${pkg}=y/d" .config
            echo "CONFIG_PACKAGE_${pkg}=n" >> .config
          done
          
          make defconfig
          
          # 验证精简生效
          for pkg in "${PLUGINS_TO_REMOVE[@]}"; do
            if grep -q "CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "❌ 警告: ${pkg} 强制启用了依赖，请手动排查"
              exit 1
            fi
          done
      - name: Clean Build
        run: |
          cd openwrt
          # make clean: 清除编译产生的目标文件，但保留配置和依赖
          # make dirclean: 彻底清除 build_dir 和 staging_dir，这是解决各种疑难杂症最彻底的方法
          make dirclean
          # 额外保险：确保 build_dir 彻底删除
          rm -rf build_dir/
      - name: Compile Firmware
        run: |
          cd openwrt
          make -j4 || make -j1 V=s

      - name: Post-Build Verify & Prepare Upload
        run: |
          cd openwrt/bin/targets/mediatek/filogic
          
          echo "=== 当前目录所有文件 ==="
          ls -lah
          
          # 1. 精确查找 sysupgrade 固件
          FIRMWARE=$(ls -1 *-squashfs-sysupgrade.itb 2>/dev/null | head -n1)
          
          if [ -z "$FIRMWARE" ]; then
            echo "❌ 致命错误: 未找到 squashfs-sysupgrade.itb!"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$FIRMWARE")
          echo "✅ 找到固件: $FIRMWARE (大小: $((SIZE/1024/1024)) MB)"
          
          if [ "$SIZE" -lt 10485760 ]; then
            echo "❌ 致命错误: 固件大小小于 10MB，这不是完整固件!"
            exit 1
          fi
          
          # 2. 生成校验和
          sha256sum *.itb > sha256sums.txt
          echo "✅ 固件校验通过，准备上传"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jcg-q30-pro-ubootmod
          path: |
            openwrt/bin/targets/mediatek/filogic/*-squashfs-sysupgrade.itb
            openwrt/bin/targets/mediatek/filogic/sha256sums.txt
          retention-days: 7

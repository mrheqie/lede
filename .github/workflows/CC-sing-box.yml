name: Build Kunpeng CC (MT7628 + EC200A) sing-box Firmware

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /var/lib/apt/lists/*
        sudo rm -rf /usr/local/share/boost /opt/az /usr/share/game /usr/local/lib/node_modules
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake xxd cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xmlto xz-utils zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH lede
        ln -sf /workdir/lede $GITHUB_WORKSPACE/lede

    - name: Update & Install feeds
      run: |
        cd lede
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 强行拉取 Homeproxy
        git clone --depth=1 https://github.com/immortalwrt/homeproxy.git package/homeproxy

    - name: Generate Custom Configuration (.config)
      run: |
        cd lede
        
        # 1. 核心架构与机型 (WT6285)
        echo "CONFIG_TARGET_ramips=y" > .config
        echo "CONFIG_TARGET_ramips_mt76x8=y" >> .config
        echo "CONFIG_TARGET_ramips_mt76x8_DEVICE_nradio_wt6285=y" >> .config
        
        # 2. 基础网页与网络加速
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        echo "CONFIG_PACKAGE_luci-compat=y" >> .config
        
        # 3. 启用核心代理组件
        echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
        echo "CONFIG_PACKAGE_sing-box=y" >> .config
        echo "CONFIG_PACKAGE_curl=y" >> .config
        echo "CONFIG_PACKAGE_ca-bundle=y" >> .config
        echo "CONFIG_TARGET_OPTIONS=y" >> .config
        echo "CONFIG_TARGET_OPTIMIZATION=\"-Os -pipe -mno-branch-likely -mips32r2 -mtune=24kc\"" >> .config
        
        # 4. 保留 4G EC200A 核心驱动组件 (QMI 拨号)
        echo "CONFIG_PACKAGE_kmod-usb-core=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb2=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
        echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-3g=y" >> .config
        echo "CONFIG_PACKAGE_luci-proto-qmi=y" >> .config
        echo "CONFIG_PACKAGE_comgt=y" >> .config
        echo "CONFIG_PACKAGE_uqmi=y" >> .config
        
        # 5. 【焦土级瘦身】砍掉一切与 4G/代理 无关的内核模块与大体积插件 (全力保卫 16MB 空间)
        echo "# CONFIG_PACKAGE_kmod-usb-storage is not set" >> .config
        echo "# CONFIG_PACKAGE_kmod-usb-storage-uas is not set" >> .config
        echo "# CONFIG_PACKAGE_kmod-fs-vfat is not set" >> .config
        echo "# CONFIG_PACKAGE_kmod-fs-ext4 is not set" >> .config
        echo "# CONFIG_PACKAGE_kmod-fs-ntfs3 is not set" >> .config
        echo "# CONFIG_PACKAGE_kmod-fs-exfat is not set" >> .config
        echo "# CONFIG_PACKAGE_automount is not set" >> .config
        
        # 拔除 Lean 固件中默认塞入的全家桶大件应用
        echo "# CONFIG_PACKAGE_luci-app-filetransfer is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-vsftpd is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-vlmcsd is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-ddns is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-arpbind is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-accesscontrol is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-wol is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-nlbwmon is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-sqm is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-upnp is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-usb-printer is not set" >> .config
        echo "# CONFIG_PACKAGE_vsftpd-alt is not set" >> .config
        echo "# CONFIG_PACKAGE_vlmcsd is not set" >> .config
        echo "# CONFIG_PACKAGE_uugamebooster is not set" >> .config
        echo "# CONFIG_PACKAGE_xlnetacc is not set" >> .config
        echo "# CONFIG_PACKAGE_etherwake is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-ssr-plus is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-passwall is not set" >> .config
        echo "# CONFIG_PACKAGE_luci-app-openclash is not set" >> .config
        
        # 6. 【围剿 Sing-box 隐形默认值】显式强制关闭所有无用协议及重型接口，锁定最低运行配置
        for prefix in SING_BOX_WITH SINGBOX_WITH; do
            echo "# CONFIG_${prefix}_ACME is not set" >> .config
            echo "# CONFIG_${prefix}_CLASH_API is not set" >> .config
            echo "# CONFIG_${prefix}_DHCP is not set" >> .config
            echo "# CONFIG_${prefix}_ECHO is not set" >> .config
            echo "# CONFIG_${prefix}_ECH is not set" >> .config
            echo "# CONFIG_${prefix}_EMBEDDED_TOR is not set" >> .config
            echo "# CONFIG_${prefix}_GRPC is not set" >> .config
            echo "# CONFIG_${prefix}_GVISOR is not set" >> .config
            echo "# CONFIG_${prefix}_QUIC is not set" >> .config
            echo "# CONFIG_${prefix}_REALITY_SERVER is not set" >> .config
            echo "# CONFIG_${prefix}_TAILSCALE is not set" >> .config
            echo "# CONFIG_${prefix}_V2RAY_API is not set" >> .config
            echo "# CONFIG_${prefix}_WIREGUARD is not set" >> .config
        done
        
        # 7. 通过 Makefile 物理擦除多余标签字符串
        echo "=== 正在魔改 Sing-box 编译配置以适配 16M Flash ==="
        SING_BOX_MAKEFILE=$(find ./feeds/ -path "*/sing-box/Makefile" | head -n 1)
        if [ -n "$SING_BOX_MAKEFILE" ]; then
            echo "-> 找到 Makefile 目标: $SING_BOX_MAKEFILE"
            sed -i 's/with_tailscale//g' "$SING_BOX_MAKEFILE"
            sed -i 's/with_gvisor//g' "$SING_BOX_MAKEFILE"
            sed -i 's/with_wireguard//g' "$SING_BOX_MAKEFILE"
            sed -i 's/with_quic//g' "$SING_BOX_MAKEFILE"
            sed -i 's/with_v2ray_api//g' "$SING_BOX_MAKEFILE"
            sed -i 's/with_clash_api//g' "$SING_BOX_MAKEFILE"
            sed -i 's/with_acme//g' "$SING_BOX_MAKEFILE"
            sed -i 's/with_grpc//g' "$SING_BOX_MAKEFILE"
            echo "✅ 物理代码标签剔除完成"
        fi
        
        # 8. 生成最终依赖
        make defconfig

    - name: Download package
      id: package
      run: |
        cd lede
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd lede
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    # 安全探针与详情汇报
    - name: Check Firmware Size (Safety Guard)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd lede/bin/targets/ramips/mt76x8/
        echo "=== 编译产物完整列表 ==="
        ls -lh
        echo "====================================================="
        
        if ! ls *sysupgrade*.bin 1> /dev/null 2>&1; then
          echo "❌ 致命错误：未找到 sysupgrade 刷机包！"
          echo "即使剔除了内核存储驱动，固件依然超标。请检查产物列表排查具体大件。"
          exit 1
        fi
        
        FILE=$(ls *sysupgrade*.bin | head -n 1)
        SIZE=$(stat -c%s "$FILE")
        if [ "$SIZE" -gt 16000000 ]; then
          echo "❌ 严重警告：固件体积 ($SIZE 字节) 虽然生成，但已极其危险逼近物理上限，强刷有风险！"
          exit 1
        else
          echo "✅ 恭喜！固件成功塞入 16MB 空间 ($SIZE 字节)！系统打包安全通过！"
        fi

    - name: Upload firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OpenWrt_KunpengCC_EC200A_Homeproxy_AnyTLS
        path: lede/bin/targets/ramips/mt76x8/*sysupgrade*.bin
        retention-days: 7
